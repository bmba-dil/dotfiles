# Use emacs keybindings in the status line
set-option -g status-keys emacs

# Let apps (nvim) send OSC 52 through tmux → terminal → host clipboard
set -g allow-passthrough on
set -g set-clipboard on

# Advertise clipboard feature to nested programs (tmux 3.2+)
set -as terminal-features ',*:clipboard'

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
# tmux-256color (not screen-256color) -- screen-256color has no sitm/ritm,
# so tmux strips italics before they reach the terminal.
set -g default-terminal "tmux-256color"
# Ghostty sets TERM=xterm-ghostty, so the pattern has to match that.
set -as terminal-features ",xterm-ghostty:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Prefix keybind
unbind -n C-z
unbind -n M-z
unbind C-a
unbind -n M-,
unbind M-,
unbind C-b
unbind M-a
set -g prefix M-s

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Bigger scrollback
set -g history-limit 100000

# Cool status bar
set-option -g status-justify left
set-option -g status-style bg='#008080'
set-option -g status-left-length 16
set-option -g status-right '%a %R #(tailscale ip -4)'
set-option -g status-interval 60

set-option -g pane-active-border-style fg=colour246
set-option -g pane-border-style fg=colour238

# Window status
setw -g window-status-current-style 'fg=colour81 bg=colour237 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# Better window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window splittings
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Vim mode for copy+paste
unbind-key -T copy-mode-vi v

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "clipcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "clipcopy"

# c now opens with current path
bind c new-window -c '#{pane_current_path}'

# source config file reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#run '~/.config/tmux/plugins/tpm'
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm &&
~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
